<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1b35">
<title>Forkcast</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--plum:#2b1b35;--plum2:#3d2a4a;--bg:#f5f1f7;--card:#fff;--ink:#24172c;--muted:#6a5d72;--line:#e7dfeb;--saffron:#f5b83d;--saffron2:#ffd27a;--herb:#2e8a57;--herb-bg:#e6f4ec;--tomato:#c94a3b;--tomato-bg:#fbeae7;--grape:#6a3e9e;--gut:12px;
  --font:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
/* Kopf */
header{background:var(--plum);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;position:sticky;top:0;z-index:3}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.hright{display:flex;align-items:center;gap:8px;min-width:0}#hdrArea:empty{display:none}
header h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0;display:flex;align-items:center;gap:8px}
header h1 svg{width:22px;height:22px;color:var(--saffron)}
#cloudDot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#e0705f;flex:none;box-shadow:0 0 0 3px rgba(224,112,95,.25)}#cloudDot[hidden]{display:none}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:16px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
nav button{border:0;border-radius:9px;padding:8px 6px;background:none;color:#d9cde0;font-size:14px;font-weight:600;cursor:pointer}
nav button.active{background:#fff;color:var(--plum);font-weight:750}
main{max-width:680px;margin:auto;padding:14px var(--gut) calc(48px + env(safe-area-inset-bottom,0px))}
/* Grundelemente */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
h2{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin:0 0 6px}
h3{font-size:17px;font-weight:750;letter-spacing:-.2px;line-height:1.25;margin:0}
.muted{color:var(--muted);font-size:13.5px}.small{font-size:12.5px;color:var(--muted)}.warn{color:var(--tomato)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.top{align-items:flex-start}
button{cursor:pointer}
.primary{background:var(--saffron);color:var(--plum);border:0;border-radius:12px;padding:11px 16px;font-weight:750;font-size:15px}
.primary:active{background:#e9a826}
.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:650}
.danger{background:var(--tomato-bg);color:var(--tomato);border:1px solid #f3cfc9;border-radius:12px;padding:9px 13px;font-weight:600}
.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.link{background:none;border:0;color:var(--grape);padding:0 0 10px;font-weight:700;font-size:14px}
a{color:var(--grape)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:15px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--grape)}
textarea{resize:vertical;margin-top:5px}
.lbl{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}.lbl input,.lbl textarea{margin-top:6px}
/* Tags */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:600;line-height:1.1;display:inline-flex;align-items:center;gap:4px}
.chip.pref{background:var(--herb-bg);border-color:var(--herb);color:#1d6b40}
.chip.excl{background:var(--tomato-bg);border-color:var(--tomato);color:var(--tomato);text-decoration:line-through}
.chip.on{background:#f3edf6;border-color:#e2d6ea}
.chip.ghost{color:var(--muted);border-style:dashed;font-weight:500}
.chip .x{border:0;background:none;padding:0 0 0 4px;font-size:18px;line-height:1;color:var(--muted)}
.chips.mini{gap:5px}.chips.mini .chip{padding:4px 10px;font-size:12.5px;border-width:1px;background:#f7f3f9;font-weight:600;color:#54475c}
.chips.mini .chip.pref{background:var(--herb-bg);color:#1d6b40}
.tagrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:9px}
/* Heute: Hero */
.hero{background:var(--plum);color:#fff;margin:-14px calc(-1*var(--gut)) 18px;padding:14px 18px 20px;border-radius:0 0 26px 26px}
.hero h2{font-size:30px;line-height:1.08;letter-spacing:-1px;margin:4px 0 6px;max-width:14ch}
.hero .hint{color:#d6cadd;font-size:13px;margin:0}
.hero .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#f6f0f9}
.hero .chip.pref{background:var(--herb);border-color:var(--herb);color:#fff}
.hero .chip.excl{background:rgba(201,74,59,.25);border-color:#e0705f;color:#ffc9c0}
.hero .muted{color:#c9bcd1}
.hero .actions{margin-top:16px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;padding:13px 18px}.cta svg{width:20px;height:20px}.actions.full{flex-direction:row-reverse;align-items:stretch}.actions.full .cta{flex:1}.actions.full .ghostbtn{flex:none}
.hero .ghostbtn{background:none;border:0;color:#d9cde0;font-weight:600;padding:10px 6px;text-decoration:underline;text-underline-offset:3px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 10px}.sechead h3{font-size:16px}
/* Vorschlag als Bon */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;position:relative}
.t-head{padding:14px 15px 12px}.t-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center}.t-rate{align-self:center}
.t-num{width:30px;height:30px;border-radius:50%;background:var(--plum);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.t-title h3{font-size:19px;letter-spacing:-.4px;overflow-wrap:anywhere}
.t-perf{position:relative;border-top:2px dashed var(--line);margin:0 16px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.t-perf::before{left:-28px;clip-path:inset(0 0 0 50%)}.t-perf::after{right:-28px;clip-path:inset(0 50% 0 0)}
.t-body{padding:11px 15px 15px}
.ticket.first{border-color:#eed79e}
.ticket.first .t-head{background:linear-gradient(180deg,#fff6df,#fff);border-radius:18px 18px 0 0}
.ticket.first .t-num{background:var(--saffron);color:var(--plum)}
.ticket.first .t-title h3{font-size:23px}
.toppick{display:block;font-size:12px;font-weight:700;color:#8a5a00;margin-bottom:8px}
.anim .ticket{animation:rise .38s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--d)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.anim .ticket{animation:none}}
.stars{color:var(--saffron);letter-spacing:1px;white-space:nowrap;font-size:15px}.stars.big{font-size:20px}.stars .half{position:relative;display:inline-block;color:#e5cf9c}.stars .half::before{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--saffron)}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.tag.new{background:#efe6f7;color:var(--grape)}
.best{background:#faf6fb;border-radius:12px;padding:9px 11px;font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.best svg{flex:none;width:17px;height:17px;color:var(--grape);margin-top:1px}
.num{display:none}
/* Liste */
.rrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;color:inherit}
.rrow:first-child{border-top:0}.rrow:active{background:#faf6fb}.rname{font-weight:750;font-size:16px}
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.dish,.visit{border-top:1px solid var(--line);padding:10px 0}.dish:first-of-type,.visit:first-of-type{border-top:0}
/* Bewertung */
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
.rate button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:750;color:var(--ink);font-size:15px}
.rate button.on{background:var(--plum);border-color:var(--plum);color:var(--saffron2)}
.dishrow{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fcfafd}
.dgrid{display:grid;grid-template-columns:70px minmax(0,1fr) 40px;gap:6px}
.dgrid .x{border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:20px;color:var(--muted)}
.dishrow input[data-k=comment]{margin-top:7px}.lasthint:empty{display:none}
/* Links */
.rlink{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin:0;padding:3px 10px 3px 8px;border-radius:16px;background:#f1eaf6;color:var(--grape);font-size:13px;font-weight:700;text-decoration:none;line-height:1.5}
.rlink svg{flex:none;width:15px;height:15px}.rlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink.ghost{background:none;color:var(--muted);font-weight:500;padding-left:0}
/* Eigenschaften */
.props{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.prop{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;line-height:1;padding:4px 8px 4px 5px;border-radius:6px;border:1px solid}
.prop.pos{color:#1d6b40;background:#f1faf4;border-color:#c3e5d0}.prop.neg{color:#9a2e22;background:#fdf3f1;border-color:#f1cdc6}
.prop i:last-of-type{margin-right:2px}.prop i{width:15px;height:15px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}.prop i svg{width:11px;height:11px;display:block}.prop i svg path{stroke:currentColor}
.prop.pos i{background:#d3ecdd;color:#2e8a57}.prop.neg i{background:#f6d6d1;color:#c94a3b}
.propbox{background:#faf7fb;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-top:6px}
.prow{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;margin:6px 0}.prow>span{font-size:12.5px;font-weight:650;color:var(--muted)}
.pgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.psec{padding:10px 0 12px;border-top:1px solid var(--line)}.psec:first-child{border-top:0;padding-top:2px}.psec:last-child{padding-bottom:2px}.psec h4{margin:0 0 4px;font-size:13.5px;font-weight:800;color:var(--plum);letter-spacing:-.1px}.psec .prow:first-of-type{margin-top:4px}.prow.nolabel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:13px;line-height:1.25;color:var(--ink);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;font-weight:550}
.prow .pbtn{width:100%;height:100%}
.pbtn.on.pos{background:var(--herb-bg);border-color:var(--herb);color:#1d6b40;font-weight:700}.pbtn.on.neg{background:var(--tomato-bg);border-color:var(--tomato);color:#9a2e22;font-weight:700}
.pbtn .w{display:inline-flex;gap:3px;flex:none}.pbtn .w i{width:15px;height:15px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}.pbtn .w i svg{width:11px;height:11px;display:block}.pbtn .w i svg path{stroke:currentColor}.pbtn.pos .w i{background:#d3ecdd;color:#2e8a57}.pbtn.neg .w i{background:#f6d6d1;color:#c94a3b}.pbtn:not(.on) .w i{opacity:.85}
.note{margin-top:10px;padding:9px 11px;border-left:3px solid var(--saffron);background:#fffaf0;font-size:13.5px;color:#4a3c52;white-space:pre-wrap;border-radius:0 10px 10px 0}
.t-body .actions{flex-wrap:nowrap}.t-body .actions>button{flex:none}
.replace{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.replace svg{width:15px;height:15px}
.ticket.fresh{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
button.best{width:100%;border:0;text-align:left;font:inherit;font-size:12px;color:inherit;cursor:pointer}button.best:active{filter:brightness(.97)}.best{font-size:12px;padding:7px 10px;gap:8px;margin-top:8px}.best svg{width:15px;height:15px}
.t-title h3{overflow:hidden}.tname{all:unset;cursor:pointer;display:block;font:inherit;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.tname .go{display:inline-block;width:.8em;height:.8em;margin-left:4px;vertical-align:-.02em;opacity:.35}.tname:focus-visible{outline:2px solid var(--grape);outline-offset:2px;border-radius:4px}
.best .go{width:15px;height:15px;margin:0 0 0 auto;flex:none;opacity:.45;color:currentColor;align-self:center}
.best .bl{min-width:0;flex:1}.best .bh{display:block;font-weight:700;font-size:11px;opacity:.75;margin-bottom:2px}
.dl{list-style:none;margin:0;padding:0}.dl li{display:flex;justify-content:space-between;gap:10px;line-height:1.5}
.dl li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl li b{font-weight:650;white-space:nowrap;opacity:.8}
.best.avoid{background:var(--tomato-bg);color:#7d2a20}.best.avoid svg{color:var(--tomato)}
.skipline{margin:-4px 4px 12px}.skipline .link{padding:0;font-size:12.5px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:#faf6fb;border-radius:12px;padding:10px 11px}.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--plum);line-height:1.1}.stat span{font-size:12px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.statlists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.statlists h3{font-size:14px;margin-bottom:4px}
.slist{list-style:none;margin:0;padding:0}.slist li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}.slist li:last-child{border:0}
.slist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slist small{color:var(--muted)}.slist b{white-space:nowrap;font-weight:750;color:var(--plum)}
.tagman .trow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.tagman .trow .cnt{order:2}.tagman .trow>.chip{flex:1 1 auto;min-width:0;order:1}.tagman .chip{min-width:0;max-width:100%;overflow:hidden;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.tagman .chip .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.tagman .chip svg{width:13px;height:13px;flex:none;color:var(--grape)}.cnt{font-size:11px;font-weight:700;color:var(--muted);background:#f3edf6;border-radius:10px;padding:2px 7px;flex:none;min-width:1.6em;text-align:center}.tagman .tact .sm{padding:6px 9px}.tagman .trow:first-child{border:0}.tagman .tact{margin-left:8px;display:flex;gap:6px;order:3}
@media(max-width:420px){.statlists{grid-template-columns:1fr;gap:12px}.stat b{font-size:22px}}
.chips.picked{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;height:46px;align-items:center;margin-top:10px;padding:0 0 10px;border-bottom:1px solid rgba(255,255,255,.14)}.chips.picked::-webkit-scrollbar{display:none}.chips.picked.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px);mask-image:linear-gradient(90deg,transparent,#000 22px)}.chips.picked.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}.chips.picked.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}.chips.picked .chip{flex:none}.hero .picked .chip.excl{background:var(--tomato);border-color:var(--tomato);color:#fff;text-decoration-color:rgba(255,255,255,.7)}
.pickhint{font-size:13px;color:#c2b3cc;border:1.5px dashed rgba(255,255,255,.3);border-radius:20px;padding:7px 13px}
/* im Slider nur dezent markiert */
.hero .slider .chip.pref{background:rgba(46,138,87,.3);border-color:#5fbf8a;color:#e8f8ee}
.hero .slider .chip.excl{background:rgba(201,74,59,.26);border-color:#e8806f;color:#ffe0da;text-decoration:line-through;text-decoration-color:rgba(255,224,218,.75)}
.chip.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.7);opacity:.3}100%{transform:scale(1);opacity:1}}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:9px;overscroll-behavior-x:contain}.slider::-webkit-scrollbar{display:none}
.slider:not(.multi){overflow:visible}
.spage{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;padding-right:2px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dot{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.5);transition:width .2s,background .2s}.dot.on{width:20px;background:var(--saffron)}
.tagman{position:relative}.tagman.collapsed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.expander{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:#faf7fb;color:var(--grape);font-weight:700;font-size:14px}
.expander svg{width:17px;height:17px;transition:transform .2s}.expander.open svg{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.chip.pop{animation:none}.dot,.expander svg{transition:none}}
.importbox{border-color:#eed79e;background:#fffbf0}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center}.dname{overflow-wrap:anywhere}.dcom{grid-column:1/-1;margin-top:-2px;font-style:italic}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1px solid #f3cfc9;background:var(--tomato-bg);color:var(--tomato);padding:0}.iconbtn svg{width:17px;height:17px}.iconbtn.big{width:42px;height:42px;border-radius:12px}.iconbtn.big svg{width:19px;height:19px}.visit .drow strong{white-space:nowrap;font-size:15px}
@media(max-width:360px){.drow .stars{font-size:13px;letter-spacing:0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,18,38,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.mbox{background:#fff;border-radius:18px;padding:18px;max-width:360px;width:100%;box-shadow:0 18px 50px rgba(30,18,38,.3)}.mbox p{margin:0 0 4px;font-size:15.5px;font-weight:600;white-space:pre-line;overflow-wrap:anywhere}
.mbox input{margin-top:10px}.mbox .actions{justify-content:flex-end;margin-top:16px}
.dangerfill{background:var(--tomato);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:750}
@keyframes fade{from{opacity:0}}@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.rscore{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1}.rscore small{font-size:14px;font-weight:750;color:var(--muted)}
.areabar{display:flex;justify-content:flex-end;margin-bottom:6px}

.areapick{display:inline-flex;align-items:center;gap:3px;max-width:42vw;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#e9dff0;border-radius:16px;padding:4px 9px 4px 7px;font-size:12.5px;font-weight:600}
.areapick svg{width:13px;height:13px;flex:none;opacity:.85}.areapick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.areapick.static{opacity:.85}
.areamenu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(30,18,38,.28);padding:6px;max-height:60vh;overflow:auto;min-width:180px;max-width:80vw;animation:fade .12s}
.areamenu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 10px;border-radius:9px;font:inherit;font-size:15px;color:var(--ink);text-align:left}
.areamenu button svg{width:16px;height:16px;flex:none;color:var(--grape)}.areamenu button span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.areamenu button.on{background:#f3edf6;font-weight:700}.areamenu .chk{color:var(--herb)}.areamenu button:active{background:#f3edf6}
.linkrow{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:6px;min-width:0}.linkrow .rlink{flex:none;align-self:center}.t-head .linkrow{margin-top:8px}
.area{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0;flex:0 1 auto;align-self:center}.area svg{width:14px;height:14px;flex:none;color:var(--muted);display:block;position:relative;top:-0.5px}.area .atxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.area.off{color:#9a2e22;background:#fdf3f1;border:1px solid #f1cdc6;border-radius:6px;padding:2px 8px 2px 6px;font-weight:650}.area.off svg{color:#c94a3b;top:0}
.ac{position:relative}.aclist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(30,18,38,.18);padding:5px;display:none;max-height:230px;overflow:auto}
.aclist.open{display:block}.aclist button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 9px;border-radius:8px;font:inherit;font-size:15px;color:var(--ink);text-align:left}
.aclist button svg{width:15px;height:15px;flex:none;color:var(--grape)}.aclist button:hover,.aclist button:active{background:#f3edf6}
.wipe{margin-top:12px}.wipe summary{cursor:pointer;font-size:12.5px;color:var(--muted)}.wipe p{margin:8px 0}
.empty{text-align:center;padding:28px 18px}.empty svg{width:64px;height:64px;color:var(--grape);opacity:.8;margin-bottom:6px}
@media(max-width:480px){:root{--gut:9px}.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;margin:4px 0 9px}.prow>span{grid-column:1/-1;margin-bottom:-1px}.card{padding:13px}.hero{padding:12px 16px 18px}.hero h2{font-size:27px}}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
</style>
</head>
<body>
<header>
<div class="hrow"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3.5 3.5-3.5 7s1.5 4 3.5 4"/></svg><span id="appName">Forkcast</span></h1><div class="hright"><span id="hdrArea"></span><button id="cloudDot" hidden onclick="openTab('data')" aria-label="Cloud backup error, open Data" title="Cloud backup error"></button></div></div>
<nav><button data-tab="today">Today</button><button data-tab="list">Restaurants</button><button data-tab="data">Data</button></nav>
</header>
<main id="app"></main>
<script>
const KEY="wohinEssenV1";
let db=load(),stack=[{tab:"today"}],tagState={},sugg=null,listQuery="",listSort="oldest",currentArea=null;

function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&Array.isArray(v.restaurants))return v}catch(e){}return{restaurants:[]}}
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){say("Saving failed: "+e.message)}}
function save(){db.updatedAt=Date.now();writeLocal();window.cloud?.push()}
// Schnittstelle für den Cloud-Teil
window.app={get:()=>db,
 replace(v){if(!v||!Array.isArray(v.restaurants))return;db=v;writeLocal();migrateTags();ensureCatalog();ensureAreaCatalog();sugg=null;render()},
 touch(){db.updatedAt=Date.now();writeLocal()},
 cloudChanged(){let c=window.cloudState,d=$("#cloudDot");if(d)d.hidden=!(c?.configured&&c.ready&&!!c.error)
  if(cur().tab==="data"&&!cur().view)render()}};
const $=s=>document.querySelector(s);
// Eigene Dialoge statt confirm/alert/prompt (die werden in manchen Umgebungen blockiert)
function dialog({msg,ok="OK",cancel="Cancel",danger=false,input=null}){return new Promise(res=>{let d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${esc(msg)}</p>${input!=null?`<input id="mIn" value="${esc(input)}" autocomplete="off">`:""}<div class="actions">${cancel?`<button class="secondary" data-m="0">${esc(cancel)}</button>`:""}<button class="${danger?"dangerfill":"primary"}" data-m="1">${esc(ok)}</button></div></div>`;
 document.body.appendChild(d);let inp=d.querySelector("#mIn");setTimeout(()=>{(inp||d.querySelector('[data-m="1"]')).focus();inp&&inp.select()},30);
 const no=()=>inp?null:false,done=v=>{d.remove();res(v)};
 d.onclick=e=>{let b=e.target.closest("[data-m]");if(b)done(b.dataset.m==="1"?(inp?inp.value:true):no());else if(e.target===d&&cancel)done(no())};
 d.onkeydown=e=>{if(e.key==="Escape"&&cancel)done(no());if(e.key==="Enter"&&inp){e.preventDefault();done(inp.value)}}})}
const ask=(msg,ok="OK",danger=false,cancel="Cancel")=>dialog({msg,ok,danger,cancel}),say=msg=>dialog({msg,cancel:null}),askText=(msg,val,ok="Save")=>dialog({msg,ok,input:val});
window.ask=ask;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
function isoToday(){let d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const weekday=iso=>(new Date(iso+"T12:00:00").getDay()+6)%7;
const daysSince=iso=>Math.round((new Date(isoToday()+"T12:00:00")-new Date(iso+"T12:00:00"))/864e5);
const fmt=iso=>new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lc=s=>String(s??"").trim().toLowerCase();
const byId=id=>db.restaurants.find(r=>r.id===id);
function areaCatalog(){return Array.isArray(db.areaCatalog)?db.areaCatalog:[]}
function normArea(a){a=String(a||"").trim().replace(/\s+/g," ");if(!a)return"";return areaCatalog().find(x=>lc(x)===lc(a))||[...new Set(db.restaurants.map(r=>r.area).filter(Boolean))].find(x=>lc(x)===lc(a))||a}
function ensureAreaCatalog(){let changed=!Array.isArray(db.areaCatalog);if(changed)db.areaCatalog=[];db.restaurants.forEach(r=>{if(r.area&&!db.areaCatalog.some(x=>lc(x)===lc(r.area))){db.areaCatalog.push(r.area);changed=true}});if(changed)save()}
function usedAreas(){let c={};db.restaurants.forEach(r=>{if(r.area)c[r.area]=(c[r.area]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,"en"))}
function pickArea(){let a=usedAreas();if(!a.length)return null;if(currentArea&&a.some(x=>lc(x)===lc(currentArea)))return currentArea;let fr=a.find(x=>lc(x)==="friedrichshain");return fr||a[0]}
const visitsOf=r=>[...(r.visits||[])].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
const lastVisit=r=>visitsOf(r)[0];
// Restaurantbewertung: gewichteter Durchschnitt, letzter Besuch zählt 1, davor 0,7, 0,49 …
function rRating(r){let vs=visitsOf(r);if(!vs.length)return null;let sw=0,sum=0;vs.slice(0,8).forEach((v,i)=>{let w=Math.pow(.7,i);sw+=w;sum+=w*v.rating});return sum/sw}
function fracStars(x,big){let full=Math.floor(x),half=x-full>=.25&&x-full<.75,rounded=x-full>=.75;let f=full+(rounded?1:0);return `<span class="stars${big?" big":""}" title="${x.toFixed(1)} of 5" aria-label="${x.toFixed(1)} of 5">${"★".repeat(f)}${half?'<span class="half">★</span>':""}${"☆".repeat(5-f-(half?1:0))}</span>`}
const rStars=(r,big)=>{let x=rRating(r);return x==null?"":fracStars(x,big)};
const rNum=r=>{let x=rRating(r);return x==null?"":x.toFixed(1).replace(/\.0$/,"")};
const stars=n=>`<span class="stars" title="${n} von 5" aria-label="${n} von 5">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`;
function cleanUrl(t){let m=String(t||"").match(/https?:\/\/\S+/i);let u=(m?m[0]:String(t||"").trim()).replace(/[)\].,]+$/,"");if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{let x=new URL(u);return x.hostname.includes(".")?x.href:""}catch{return""}}
const isMaps=u=>{try{let h=new URL(u).hostname,p=new URL(u).pathname;return/(^|\.)maps\.app\.goo\.gl$|(^|\.)maps\.google\./.test(h)||(/(^|\.)google\.[a-z.]+$/.test(h)&&p.startsWith("/maps"))||(h==="goo.gl"&&p.startsWith("/maps"))}catch{return false}};
const PIN='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z"/></svg>',
LINK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
const DICE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
BOWL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0zM8 8c0-1.5 1-2 1-3.5M12 8c0-1.5 1-2 1-3.5M16 8c0-1.5 1-2 1-3.5"/></svg>';
let animateNext=false,justReplaced=-1;
const REPL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>',
NOPE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>';
const mapsSearch=r=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name);
function linkHtml(r,compact){if(r.link){let maps=isMaps(r.link),label=maps?(compact?"Maps":"Open in Maps"):new URL(r.link).hostname.replace(/^www\./,"");return`<a class="rlink" href="${esc(r.link)}" target="_blank" rel="noopener">${LINK}<span>${esc(label)}</span></a>`}
return`<a class="rlink ghost" href="${esc(mapsSearch(r))}" target="_blank" rel="noopener">${LINK}<span>${compact?"Search":"Search in Maps"}</span></a>`}
// Eigenschaften: w = Gewicht (je Punkt ±7 %, gesamt max. ±50 %), x = schließt sich gegenseitig aus
const PROPS=[
 // Price
 {k:"billig",l:"Cheap",w:1,x:"teuer",g:"Price",s:"Price"},{k:"teuer",l:"Expensive",w:-2,x:"billig",g:"Price",s:"Price"},
 // Food
 {k:"fleisch_gut",l:"Excellent meat",w:2,x:"fleisch_schlecht",g:"Meat",s:"Food"},{k:"fleisch_schlecht",l:"Poor meat",w:-2,x:"fleisch_gut",g:"Meat",s:"Food"},
 {k:"drinks_gut",l:"Good drinks",w:2,x:"drinks_schlecht",g:"Drinks",s:"Food"},{k:"drinks_schlecht",l:"Bad drinks",w:-2,x:"drinks_gut",g:"Drinks",s:"Food"},
 {k:"gross",l:"Large portions",w:1,x:"klein",g:"Portions",s:"Food"},{k:"klein",l:"Small portions",w:-1,x:"gross",g:"Portions",s:"Food"},
 {k:"dessert_gut",l:"Good desserts",w:1,x:"dessert_schlecht",g:"Desserts",s:"Food"},{k:"dessert_schlecht",l:"Bad desserts",w:-1,x:"dessert_gut",g:"Desserts",s:"Food"},
 // Ambience
 {k:"rauchen_aussen",l:"Smoking allowed outside",w:-1,x:"rauchen",g:"Smoking",s:"Ambience"},{k:"rauchen",l:"Smoking allowed",w:-2,x:"rauchen_aussen",g:"Smoking",s:"Ambience"},
 {k:"ruhig",l:"Quiet",w:1,x:"laut",g:"Noise",s:"Ambience"},{k:"laut",l:"Loud",w:-2,x:"ruhig",g:"Noise",s:"Ambience"},
 {k:"gemuetlich",l:"Cozy",w:1,g:"Room",s:"Ambience"},{k:"beengt",l:"Cramped",w:-1,g:"Room",s:"Ambience"},
 // Service
 {k:"warte_kurz",l:"Short wait",w:1,x:"warte_lang",g:"Wait",s:"Service"},{k:"warte_lang",l:"Long wait",w:-1,x:"warte_kurz",g:"Wait",s:"Service"},
 {k:"freundlich",l:"Friendly staff",w:1,x:"unfreundlich",g:"Staff",s:"Service"},{k:"unfreundlich",l:"Rude staff",w:-2,x:"freundlich",g:"Staff",s:"Service"},
 // Other
 {k:"reservierung",l:"Booking needed",w:-1,s:"Other"}];
const PSECTIONS=["Price","Food","Ambience","Service","Other"];
const PROP=Object.fromEntries(PROPS.map(p=>[p.k,p]));
const propFactor=r=>Math.min(1.5,Math.max(.5,1+.07*(r.props||[]).reduce((a,k)=>a+(PROP[k]?.w||0),0)));
const wLabel=w=>`<span class="w" aria-label="${w>0?"+":"−"}${Math.abs(w)}">${`<i>${w>0?"<svg viewBox='0 0 12 12'><path d='M6 2.2v7.6M2.2 6h7.6' stroke='#fff' stroke-width='2' stroke-linecap='round'/></svg>":"<svg viewBox='0 0 12 12'><path d='M2.2 6h7.6' stroke='#fff' stroke-width='2' stroke-linecap='round'/></svg>"}</i>`.repeat(Math.abs(w))}</span>`;
function propsHtml(r){let ps=(r.props||[]).map(k=>PROP[k]).filter(Boolean).sort((a,b)=>b.w-a.w);return ps.length?`<div class="props">${ps.map(p=>`<span class="prop ${p.w>0?"pos":"neg"}">${`<i>${p.w>0?"<svg viewBox='0 0 12 12'><path d='M6 2.2v7.6M2.2 6h7.6' stroke='#fff' stroke-width='2' stroke-linecap='round'/></svg>":"<svg viewBox='0 0 12 12'><path d='M2.2 6h7.6' stroke='#fff' stroke-width='2' stroke-linecap='round'/></svg>"}</i>`.repeat(Math.abs(p.w))}${esc(p.l)}</span>`).join("")}</div>`:""}
const noteHtml=r=>r.note?.trim()?`<div class="note">${esc(r.note.trim())}</div>`:"";
const BIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const shortDish=d=>(d.no?d.no+" · ":"")+(d.name.length>20?d.name.slice(0,20).trimEnd()+"...":d.name);
const CHEVR='<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const dishLabel=d=>(d.no?d.no+" · ":"")+d.name;

// Gerichte eines Restaurants zusammengefasst (neueste Bewertung zählt)
function dishesOf(r){let m=new Map();visitsOf(r).reverse().forEach(v=>(v.dishes||[]).forEach(d=>{let k=lc(d.name);if(!k)return;let e=m.get(k)||{count:0,no:"",comment:""};m.set(k,{name:d.name.trim(),no:d.no||e.no,rating:d.rating,comment:d.comment||e.comment,count:e.count+1,date:v.date})}));return[...m.values()].sort((a,b)=>b.rating-a.rating||b.count-a.count)}
function allTags(){let m=new Map();db.restaurants.forEach(r=>(r.tags||[]).forEach(t=>{let k=lc(t),e=m.get(k);m.set(k,{name:e?.name||t,n:(e?.n||0)+1})}));return[...m.values()].sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,"en"))}
// Vorgegebene Tags (Sprache immer Englisch)
const PRESET_TAGS=["Italian","Japanese","Chinese","Thai","Vietnamese","Korean","Indian","Lebanese","Israeli","Mexican","Spanish","Fusion","Asian",
 "Pizza","Pasta","Noodles","Ramen","Dumplings","Curry","Burger","Seafood","Bowls","Tapas","Street food","Brunch","Café","Coffee","Bakery","Ice cream","Sweet","Takeaway","Outdoor seating","Light","Hearty","Spicy"];
// Deutsche Tags automatisch ins Englische übertragen
const TAG_EN={"italienisch":"Italian","italiener":"Italian","japanisch":"Japanese","chinesisch":"Chinese","thai":"Thai","thailändisch":"Thai","vietnamesisch":"Vietnamese","koreanisch":"Korean","indisch":"Indian","libanesisch":"Lebanese","israelisch":"Israeli","mexikanisch":"Mexican","spanisch":"Spanish","asiatisch":"Asian","asia":"Asian",
 "nudeln":"Noodles","nudel-fokus":"Noodles","nudel fokus":"Noodles","teigtaschen":"Dumplings","meeresfrüchte":"Seafood","fisch":"Seafood","burger":"Burger","leicht":"Light","leichte gerichte":"Light","leichtes essen":"Light","deftig":"Hearty","herzhaft":"Hearty","scharf":"Spicy","streetfood":"Street food"};
const SHOW_ALL_TAGS_IN_PICKER=false; // NUR ZUM TESTEN: zeigt alle Katalog-Tags in der Tagesauswahl. Später auf false setzen.
function catalog(){return Array.isArray(db.tagCatalog)?db.tagCatalog:PRESET_TAGS}
function normTag(t){t=String(t).trim().replace(/\s+/g," ");if(!t)return"";t=TAG_EN[lc(t)]||t;return catalog().find(x=>lc(x)===lc(t))||allTags().find(x=>lc(x.name)===lc(t))?.name||t}
// Tag-Katalog: Vorgaben + alle je vergebenen Tags; per "Data → Tags" bearbeitbar
function ensureCatalog(){let changed=!Array.isArray(db.tagCatalog);if(changed)db.tagCatalog=[...PRESET_TAGS];allTags().forEach(t=>{if(!db.tagCatalog.some(x=>lc(x)===lc(t.name))){db.tagCatalog.push(t.name);changed=true}});if(changed)save()}
function catalogRows(){let used=allTags(),cnt=Object.fromEntries(used.map(x=>[lc(x.name),x.n]));let rows=catalog().map((name,i)=>({name,n:cnt[lc(name)]||0,i}));used.forEach(u=>{if(!rows.some(r=>lc(r.name)===lc(u.name)))rows.push({name:u.name,n:u.n,i:999})});return rows.sort((a,b)=>b.n-a.n||a.i-b.i)}
function tagPool(){let used=allTags(),have=used.map(x=>lc(x.name));return[...used,...catalog().filter(t=>!have.includes(lc(t))).map(name=>({name,n:0}))]}
function migrateTags(){let changed=false;db.restaurants.forEach(r=>{let out=[];(r.tags||[]).forEach(t=>{let n=TAG_EN[lc(t)]||PRESET_TAGS.find(x=>lc(x)===lc(t))||t;if(!out.some(x=>lc(x)===lc(n)))out.push(n)});if(JSON.stringify(out)!==JSON.stringify(r.tags||[])){r.tags=out;changed=true}});if(changed)save()}
function when(r){let v=lastVisit(r);if(!v)return"never visited";let d=daysSince(v.date);return d<=0?"visited today":d===1?"visited yesterday":`visited ${d} days ago`}

// Navigation mit Android-Zurück-Taste
const cur=()=>stack[stack.length-1];
function go(v,replace){if(replace)stack[stack.length-1]=v;else{stack.push(v);history.pushState({},"")}render();scrollTo(0,0)}
function nav(v){v.tab=v.tab||cur().tab||"list";go(v)}
function back(){if(stack.length>1)history.back();else{stack=[{tab:"today"}];render()}}
addEventListener("popstate",()=>{if(stack.length>1){stack.pop();render()}});
function openTab(t){let n=stack.length-1;stack=[{tab:t}];if(n>0)history.go(-n);render();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openTab(b.dataset.tab));

function render(){let v=cur(),app=$("#app");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===(v.tab||"list")));renderHeaderArea();
if(v.view==="new"||v.view==="edit")return renderForm(app,v);
if(v.view==="detail")return renderDetail(app,v);
if(v.view==="visit")return renderVisit(app,v);
if(v.view==="dish")return renderDish(app,v);
if(v.tab==="list")return renderList(app);
if(v.tab==="data")return renderData(app);
renderToday(app)}

// ---------- Vorschläge ----------
function skippedToday(){try{let v=JSON.parse(localStorage.getItem("forkcastSkip")||"null");if(v&&v.date===isoToday()&&Array.isArray(v.ids))return v.ids}catch(e){}return[]}
function setSkipped(ids){try{localStorage.setItem("forkcastSkip",JSON.stringify({date:isoToday(),ids}))}catch(e){}}
function renderHeaderArea(){let hdr=$("#hdrArea");if(!hdr)return;let areas=usedAreas(),area=pickArea();
 if(!areas.length){hdr.innerHTML="";return}
 hdr.innerHTML=areas.length>1?`<button class="areapick" id="areaPick" aria-haspopup="listbox">${PINMINI}<span>${esc(area)}</span></button>`:`<span class="areapick static">${PINMINI}<span>${esc(areas[0])}</span></span>`;
 let ap=$("#areaPick");if(ap)ap.onclick=()=>openAreaMenu(ap,areas,area,a=>{currentArea=a;sugg&&(sugg=suggest());render()})}
function suggest(exclude=[],n=5){let pref=[],excl=[],skip=new Set([...skippedToday(),...exclude]),area=pickArea();for(let[k,s]of Object.entries(tagState)){if(s===1)pref.push(k);if(s===-1)excl.push(k)}
let wd=weekday(isoToday()),closed=0,pool=[];
db.restaurants.forEach(r=>{if(skip.has(r.id))return;if(!r.area)return;let tl=(r.tags||[]).map(lc);if(tl.some(t=>excl.includes(t)))return;if((r.closed||[]).includes(wd)){closed++;return}
let v=lastVisit(r),d=v?Math.max(0,daysSince(v.date)):0,top=dishesOf(r).slice(0,3);
let rt=v?rRating(r)/5:.6,                                   // Restaurantbewertung (Wunschliste: neutral)
    rec=v?Math.min(d,45)/45:.6,                           // Tage seit letztem Besuch, gedeckelt bei 45 (25 %)
    dt=top.length?top.reduce((a,x)=>a+x.rating,0)/top.length/5:rt, // beste Gerichte
    s=.55*rt+.25*rec+.2*dt;
if(v&&d<7)s*=.3;                                          // in der letzten Woche dort gewesen
let m=pref.length?tl.filter(t=>pref.includes(t)).length:0;if(m)s*=1+.5*m;           // mehrere passende Tags: innerhalb der Gruppe bevorzugt
let here=!area||lc(r.area)===lc(area);if(!here)s*=.05;                     // anderer Ort: stark abgewertet
pool.push({r,m,w:(Math.pow(s,1.5)+.01)*propFactor(r)})});  // Eigenschaften: ±7 % je Punkt, max. ±50 %                   // hoch 1,5 = gute Treffer bevorzugt, aber mit Abwechslung
// Bevorzugte Tags: gestaffelt nach Anzahl Treffer, innerhalb jeder Stufe gewichtet gewürfelt
const draw=g=>{let out=[];while(out.length<n&&g.length){let sum=g.reduce((a,x)=>a+x.w,0),x=Math.random()*sum,i=0;while(i<g.length-1&&(x-=g[i].w)>0)i++;out.push(g.splice(i,1)[0].r)}return out};
let levels=[...new Set(pool.map(x=>x.m))].sort((a,b)=>b-a);                // mehr Treffer = weiter oben
let list=levels.flatMap(l=>draw(pool.filter(x=>x.m===l))).slice(0,n);
return{list,closed,pref,area}}

 document.body.appendChild(m);let r=anchor.getBoundingClientRect();m.style.top=(r.bottom+6)+"px";m.style.right=(innerWidth-r.right)+"px";

function chipHtml(t,top){let k=lc(t.name),s=tagState[k]||0;return`<button class="chip ${s===1?"pref":s===-1?"excl":""} ${top&&popTag===k?"pop":""}" data-tag="${esc(k)}">${s===1?"✓ ":s===-1?"✕ ":""}${esc(t.name)}</button>`}
function pickerHtml(tags){let sel=Object.keys(tagState).filter(k=>tagState[k]).map(k=>tags.find(t=>lc(t.name)===k)).filter(Boolean),rest=tags,pages=[]; /* Slider enthält immer alle Tags: kein Umbrechen, kein Springen */for(let i=0;i<rest.length;i+=PAGE)pages.push(rest.slice(i,i+PAGE));
tagPage=Math.min(tagPage,Math.max(0,pages.length-1));
return`<div class="chips picked" id="picked">${sel.length?sel.map(t=>chipHtml(t,true)).join(""):`<span class="pickhint">Nothing selected</span>`}</div>
${pages.length?`<div class="slider ${pages.length>1?"multi":""}" id="tagSlider">${pages.map(p=>`<div class="spage">${p.map(t=>chipHtml(t,false)).join("")}</div>`).join("")}</div>
${pages.length>1?`<div class="dots" role="tablist">${pages.map((_,i)=>`<button class="dot ${i===tagPage?"on":""}" data-page="${i}" aria-label="Tags page ${i+1} of ${pages.length}"></button>`).join("")}</div>`:""}`:""}`}

function tagEditor(el,tags){el.innerHTML=`<div class="chips" data-sel></div><div class="tagrow"><input data-in placeholder="New tag" enterkeyhint="done" autocomplete="off"><button type="button" class="secondary" data-add>Add</button></div><div class="chips" data-sug></div>`;

const push=t=>{t=normTag(t);if(t&&!tags.some(x=>lc(x)===lc(t)))tags.push(t)};
const draw=()=>{let have=tags.map(lc),q=lc(inp.value);
sel.innerHTML=tags.map((t,i)=>`<span class="chip on">${esc(t)}<button type="button" class="x" data-rm="${i}" aria-label="Remove ${esc(t)}">×</button></span>`).join("")||`<span class="small">No tags yet</span>`;

inp.oninput=()=>{if(inp.value.includes(",")){let p=inp.value.split(",");inp.value=p.pop();p.forEach(push)}draw()};

if(orig)Object.assign(orig,data);else(r.visits??=[]).push({id:uid(),created:Date.now(),...data});save();sugg=null;app.onclick=null;back()}}

const li=(a,b)=>`<li><span>${a}</span><b>${b}</b></li>`;
return`<div class="card"><h2>Stats</h2><div class="statgrid"><div class="stat"><b>${m}</b><span>visit${m===1?"":"s"} this month</span></div><div class="stat"><b>${y}</b><span>visit${y===1?"":"s"} this year</span></div><div class="stat"><b>${pw}</b><span>per week, last 3 months</span></div></div>

${dishes.length?`<div><h3>Favourite dishes</h3><ul class="slist">${dishes.map(d=>li(`${esc(d.name)} <small>${esc(d.r.name)}</small>`,d.rating+"/5")).join("")}</ul></div>`:""}</div>
<p class="small" style="margin-top:12px">${db.restaurants.length} restaurant${db.restaurants.length===1?"":"s"} in total, ${db.restaurants.filter(r=>!r.visits?.length).length} on the wishlist.</p></div>`}
let tagsExpanded=false,areasExpanded=false;

function areasHtml(){let all=[...new Set([...areaCatalog(),...usedAreas()])],cnt={};db.restaurants.forEach(r=>{if(r.area)cnt[lc(r.area)]=(cnt[lc(r.area)]||0)+1});
let rows=all.map(a=>({name:a,n:cnt[lc(a)]||0})).sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name,"en"));
let SHOW=5,more=rows.length-SHOW,vis=areasExpanded?rows:rows.slice(0,SHOW);
return`<div class="card" id="areaCard"><h2>Areas</h2><p class="muted">Districts you can pick from when suggesting. Every restaurant needs one. Renaming an area to an existing one merges both.</p>

<div class="tagman ${!areasExpanded&&more>0?"collapsed":""}">${vis.length?vis.map(a=>`<div class="trow"><span class="chip on">${PINMINI}<span class="cname">${esc(a.name)}</span></span><small class="cnt" title="Used by ${a.n} restaurant${a.n===1?"":"s"}">${a.n}</small><span class="tact"><button class="secondary sm" data-aren="${esc(a.name)}">Rename</button><button class="iconbtn" data-adel="${esc(a.name)}" aria-label="Delete ${esc(a.name)}" title="Delete">${BIN}</button></span></div>`).join(""):`<p class="muted">No areas yet.</p>`}</div>
${more>0?`<button class="expander ${areasExpanded?"open":""}" id="areaToggle" aria-expanded="${areasExpanded}">${areasExpanded?"Show fewer":`Show all ${rows.length} areas`}${CHEV}</button>`:""}</div>`}
async function renameArea(old){let nw=await askText(`Rename “${old}” to:`,old,"Rename");if(nw==null)return;nw=nw.trim().replace(/\s+/g," ");if(!nw||nw===old)return;
 let ex=[...new Set([...areaCatalog(),...usedAreas()])].find(x=>lc(x)===lc(nw)&&lc(x)!==lc(old));if(ex){if(!await ask(`“${ex}” already exists. Merge “${old}” into it?`,"Merge"))return;nw=ex}
 db.restaurants.forEach(r=>{if(r.area&&lc(r.area)===lc(old))r.area=nw});
 let c=[];(areaCatalog()).map(a=>lc(a)===lc(old)?nw:a).forEach(a=>{if(!c.some(x=>lc(x)===lc(a)))c.push(a)});if(!c.some(x=>lc(x)===lc(nw)))c.push(nw);db.areaCatalog=c;
 if(currentArea&&lc(currentArea)===lc(old))currentArea=nw;save();sugg=null;render()}

 if(n){say(`“${name}” is used by ${n} restaurant${n===1?"":"s"}. Change their area first, then delete it.`);return}
 if(!await ask(`Delete “${name}”?`,"Delete",true))return;db.areaCatalog=areaCatalog().filter(a=>lc(a)!==lc(name));save();render()}

return`<div class="card" id="tagCard"><h2>Tags</h2><p class="muted">These tags are suggested when you add a restaurant. Renaming a tag to an existing one merges both.</p>

<div class="tagman ${!tagsExpanded&&more>0?"collapsed":""}">${vis.map(t=>`<div class="trow"><span class="chip on"><span class="cname">${esc(t.name)}</span></span><small class="cnt" title="Used by ${t.n} restaurant${t.n===1?"":"s"}">${t.n}</small><span class="tact"><button class="secondary sm" data-tren="${esc(t.name)}">Rename</button><button class="iconbtn" data-tdel="${esc(t.name)}" aria-label="Delete ${esc(t.name)}" title="Delete">${BIN}</button></span></div>`).join("")||`<p class="muted">No tags yet.</p>`}</div>

async function renameTag(old){let nw=await askText(`Rename “${old}” to:`,old,"Rename");if(nw==null)return;nw=nw.trim().replace(/\s+/g," ");if(!nw||nw===old)return;
let target=catalogRows().find(x=>lc(x.name)===lc(nw)&&lc(x.name)!==lc(old));if(target){if(!await ask(`“${target.name}” already exists. Merge “${old}” into it?`,"Merge"))return;nw=target.name}
db.restaurants.forEach(r=>{if(!(r.tags||[]).some(t=>lc(t)===lc(old)))return;let out=[];r.tags.map(t=>lc(t)===lc(old)?nw:t).forEach(t=>{if(!out.some(x=>lc(x)===lc(t)))out.push(t)});r.tags=out});
let c=[];(db.tagCatalog||[]).map(t=>lc(t)===lc(old)?nw:t).forEach(t=>{if(!c.some(x=>lc(x)===lc(t)))c.push(t)});if(!c.some(x=>lc(x)===lc(nw)))c.push(nw);db.tagCatalog=c;save();tagState={};sugg=null;render()}

function renderData(app){let n=db.restaurants.length,vis=db.restaurants.reduce((a,r)=>a+(r.visits||[]).length,0);

async function exportData(){let name="forkcast-backup-"+isoToday()+".json",json=JSON.stringify(db,null,2);
try{let file=new File([json],name,{type:"application/json"});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:name});return done()}}catch(e){if(e.name==="AbortError")return}
let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);done();
function done(){}}
let pendingImport=null,importMsg="";
function importData(e){let file=e.target.files[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result);if(!Array.isArray(v.restaurants))throw 0;pendingImport={data:v,name:file.name};importMsg="";render();$("#importBox")?.scrollIntoView({block:"center"})}catch{say("This file isn’t a valid backup of this app.")}};rd.readAsText(file)}
async function doImport(mode){let v=pendingImport?.data;if(!v)return;
 if(mode==="replace"){if(!await ask("Replace all current data with this backup?","Replace all",true))return;db=v;importMsg=`Replaced with ${v.restaurants.length} restaurants from the backup.`}
 else{let newR=0,newV=0;const sameVisit=(a,b)=>a.id===b.id||(a.date===b.date&&a.rating===b.rating&&JSON.stringify((a.dishes||[]).map(d=>lc(d.name)))===JSON.stringify((b.dishes||[]).map(d=>lc(d.name))));
  v.restaurants.forEach(ir=>{let r=db.restaurants.find(x=>x.id===ir.id)||db.restaurants.find(x=>lc(x.name)===lc(ir.name));
   if(!r){if(db.restaurants.some(x=>x.id===ir.id))ir={...ir,id:uid()};db.restaurants.push(ir);newR++;newV+=(ir.visits||[]).length;return}
   (ir.visits||[]).forEach(iv=>{if(!(r.visits||[]).some(x=>sameVisit(x,iv))){(r.visits??=[]).push(r.visits.some(x=>x.id===iv.id)?{...iv,id:uid()}:iv);newV++}});
   (ir.tags||[]).forEach(t=>{if(!(r.tags??=[]).some(x=>lc(x)===lc(t)))r.tags.push(t)});
   if(!r.link&&ir.link)r.link=ir.link;if(!r.note&&ir.note)r.note=ir.note;if(!r.closed?.length&&ir.closed?.length)r.closed=ir.closed;
   if(!r.props?.length&&ir.props?.length)r.props=ir.props});
  if(Array.isArray(v.tagCatalog)){ensureCatalog();v.tagCatalog.forEach(t=>{if(!db.tagCatalog.some(x=>lc(x)===lc(t)))db.tagCatalog.push(t)})}
  importMsg=`Merged: ${newR} new restaurant${newR===1?"":"s"}, ${newV} new visit${newV===1?"":"s"}. Existing entries were kept.`}
 pendingImport=null;migrateTags();ensureCatalog();ensureAreaCatalog();save();sugg=null;tagState={};render()}
async function resetLocal(){if(!await ask("Clear all data on this device? Your cloud backup will not be touched, and signing in again restores it.","Clear device",true))return;
 db={restaurants:[],tagCatalog:[...PRESET_TAGS],areaCatalog:[]};writeLocal();sugg=null;tagState={};currentArea=null;
 if(window.cloud?.signOut)await window.cloud.signOut(true);render()}
async function wipeCloud(){if(!await ask("Permanently delete the cloud backup? This cannot be undone.","Delete backup",true))return;let ok=window.cloud?.wipe?await window.cloud.wipe():false;say(ok?"Cloud backup deleted.":"Could not delete the cloud backup. Check your connection and that you are signed in.")}

migrateTags();ensureCatalog();ensureAreaCatalog();
render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js");
if(navigator.storage?.persist)navigator.storage.persist();
</script>
<script type="module">
// ▼▼▼ Paste Firebase config here (Firebase console → Project settings → Your apps → SDK setup and configuration) ▼▼▼
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBuuGk9s0DSU2VioK5vmv5yu9a1tPUH30Q",
  authDomain: "forkcast-ab39c.firebaseapp.com",
  projectId: "forkcast-ab39c",
  appId: "1:14711500816:web:f2fe295f5b16f279555a95"
};
// ▲▲▲

const V="12.19.0",U=m=>`https://www.gstatic.com/firebasejs/${V}/firebase-${m}.js`;
const st=window.cloudState={configured:!!FIREBASE_CONFIG.apiKey,ready:false,user:null,status:"idle",last:null,error:""};
const upd=()=>window.app.cloudChanged();
const msg=e=>({"auth/unauthorized-domain":"This address is not listed as an authorized domain in Firebase.","permission-denied":"Access denied. Check the Firestore security rules (correct email address?).","auth/network-request-failed":"No internet connection.","auth/configuration-not-found":"Google sign-in is not enabled in Firebase."})[e?.code]||("Error: "+(e?.code||e?.message||e));
addEventListener("online",upd);addEventListener("offline",upd);
if(st.configured)start().catch(e=>{st.error="Cloud not reachable. "+msg(e);upd()});else upd();

async function start(){
  const [{initializeApp},A,F]=await Promise.all([import(U("app")),import(U("auth")),import(U("firestore"))]);
  const fb=initializeApp(FIREBASE_CONFIG),auth=A.getAuth(fb);
  const fs=F.initializeFirestore(fb,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
  let ref=null,unsub=null,timer=null;
  const ok=()=>{st.status="ok";st.last=Date.now();st.error=""};
  async function write(){if(!ref)return;const db=window.app.get();st.status="pending";upd();
    try{await F.setDoc(ref,{data:JSON.stringify(db),updatedAt:db.updatedAt||Date.now()});ok()}catch(e){st.status="error";st.error=msg(e)}upd()}
  window.cloud={
    async signIn(){st.error="";const p=new A.GoogleAuthProvider();
      try{await A.signInWithPopup(auth,p)}catch(e){
        if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){
          try{await A.signInWithRedirect(auth,p)}catch(e2){st.error=msg(e2)||"Could not open the sign-in page. If you're testing inside a chat preview, open the app's real web address in its own browser tab instead.";upd()}
          return}
        if(!["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code)){st.error=msg(e);upd()}}},
    async signOut(silent){if(silent||await window.ask("Sign out? Your data stays on this device but is no longer backed up.","Sign out")){detach();await A.signOut(auth)}},
    detach(){detach()},
    async wipe(){if(!ref)return false;try{await F.deleteDoc(ref);st.last=null;upd();return true}catch(e){st.error=msg(e);upd();return false}},
    push(){if(!ref)return;clearTimeout(timer);st.status="pending";upd();timer=setTimeout(write,600)}
  };
  function detach(){unsub?.();unsub=null;ref=null}
  st.ready=true;upd();
  A.getRedirectResult(auth).catch(e=>{st.error=msg(e);upd()});
  A.onAuthStateChanged(auth,user=>{unsub?.();unsub=null;ref=null;st.user=user?{email:user.email,uid:user.uid}:null;st.status="idle";
    if(user){ref=F.doc(fs,"shared","forkcast");st.status="pending";
      unsub=F.onSnapshot(ref,async snap=>{
        if(snap.metadata.hasPendingWrites)return;                  // eigene, noch nicht bestätigte Änderung
        const local=window.app.get(),lt=local.updatedAt||0,first=localStorage.getItem("forkcastSyncedShared")!=="1";
        localStorage.setItem("forkcastSyncedShared","1");
        if(!snap.exists()){local.restaurants.length?write():(ok(),upd());return}       // erste Anmeldung: lokale Daten hochladen
        const r=snap.data();let remote;try{remote=JSON.parse(r.data)}catch{st.status="error";st.error="Cloud data is corrupted.";upd();return}
        const rt=r.updatedAt||0;
        if(first&&local.restaurants.length&&remote.restaurants?.length&&r.data!==JSON.stringify(local)){
          if(await window.ask(`There is already data in the cloud (${remote.restaurants.length} restaurants) and on this device (${local.restaurants.length}). Which should be kept?`,"Use cloud data",false,"Upload this device")){window.app.replace(remote);ok()}
          else{window.app.touch();write();return}
        }else if(rt>lt){window.app.replace(remote);ok()}          // Cloud ist neuer (z. B. neues Handy)
        else if(rt<lt){write();return}                              // Gerät ist neuer (z. B. offline geändert)
        else ok();
        upd()},e=>{st.status="error";st.error=msg(e);upd()})}
    upd()});
}
